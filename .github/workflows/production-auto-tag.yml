name: Production Auto Tag

on:
  push:
    branches:
      - production

permissions:
  contents: write

concurrency:
  group: production-auto-tag
  cancel-in-progress: false

jobs:
  create-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          EXISTING_TAG="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ -n "$EXISTING_TAG" ]]; then
            echo "should_create=false" >> "$GITHUB_OUTPUT"
            echo "tag=$EXISTING_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TAG="$(git tag -l 'v*.*.*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ -z "$LAST_TAG" ]]; then
            LAST_TAG="v0.0.0"
          fi

          VERSION="${LAST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEXT_PATCH="$((PATCH + 1))"
          NEXT_TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}"

          echo "should_create=true" >> "$GITHUB_OUTPUT"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.version.outputs.should_create == 'true'
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.version.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG"
          git push origin "$TAG"

      - name: Summary
        shell: bash
        run: |
          if [[ "${{ steps.version.outputs.should_create }}" == "true" ]]; then
            echo "Created tag: ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipped tag creation. Existing tag on commit: ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          fi
