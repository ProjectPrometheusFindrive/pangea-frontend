openapi: 3.0.3
info:
  title: Pangea API v2 Draft (BK-002)
  version: 0.1.0-bk002
  description: |
    BK-002(OpenAPI v2 초안 작성) 범위의 최소 계약서다.
    본 문서는 인증/자산/예약/조치/결제/매출/설정 도메인을 포함한다.

    용어 기준:
    - vehicle 식별자: vehicleNumber (legacy plate는 API 경계에서 정규화)
    - reservation type: reservation | rental | return
    - status는 도메인별 enum으로 분리

    참고 문서:
    - docs/common_glossary.md (BK-001)
    - planning/03_be_development_plan.md
servers:
  - url: https://api.pangea.local
    description: Local/Dev placeholder
tags:
  - name: Auth
    description: 인증/세션
  - name: Assets
    description: 차량 자산
  - name: Reservations
    description: 예약/계약
  - name: ActionItems
    description: 조치 필요 항목
  - name: Payments
    description: 결제/미납
  - name: Revenue
    description: 매출
  - name: Settings
    description: 회사/지오펜스/계정/대량반영
security:
  - bearerAuth: []
paths:
  /api/v2/auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      security: []
      operationId: postAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/auth/me:
    get:
      tags: [Auth]
      summary: 현재 사용자 조회
      operationId: getAuthMe
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v2/auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      operationId: postAuthLogout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v2/assets:
    get:
      tags: [Assets]
      summary: 자산 목록 조회
      operationId: getAssets
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - in: query
          name: search
          schema:
            type: string
          description: vehicleNumber 또는 model 검색
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/VehicleStatus'
        - in: query
          name: model
          schema:
            type: string
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Assets]
      summary: 자산 등록
      operationId: postAssets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreateRequest'
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/assets/{assetId}:
    parameters:
      - in: path
        name: assetId
        required: true
        schema:
          type: string
    get:
      tags: [Assets]
      summary: 자산 상세 조회
      operationId: getAssetById
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetailResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Assets]
      summary: 자산 정보 수정
      operationId: patchAssetById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/assets/{assetId}/history:
    parameters:
      - in: path
        name: assetId
        required: true
        schema:
          type: string
    get:
      tags: [Assets]
      summary: 자산 이력 조회
      operationId: getAssetHistory
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetHistoryListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v2/reservations:
    get:
      tags: [Reservations]
      summary: 예약/계약 목록 조회
      operationId: getReservations
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - in: query
          name: type
          schema:
            $ref: '#/components/schemas/ReservationType'
        - in: query
          name: paymentStatus
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - in: query
          name: vehicleNumber
          schema:
            type: string
        - in: query
          name: customerName
          schema:
            type: string
        - in: query
          name: fromDate
          schema:
            type: string
            format: date
        - in: query
          name: toDate
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Reservations]
      summary: 신규 계약 등록
      operationId: postReservations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreateRequest'
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/reservations/{reservationId}:
    parameters:
      - in: path
        name: reservationId
        required: true
        schema:
          type: string
    patch:
      tags: [Reservations]
      summary: 계약 정보/상태 수정 (반납/취소 포함)
      operationId: patchReservationById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/reservations/{reservationId}/accident:
    parameters:
      - in: path
        name: reservationId
        required: true
        schema:
          type: string
    post:
      tags: [Reservations]
      summary: 사고 접수 등록
      operationId: postReservationAccident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccidentCreateRequest'
      responses:
        '201':
          description: 등록 성공 (조치 항목 생성)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionItemDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/action-items:
    get:
      tags: [ActionItems]
      summary: 조치 항목 목록 조회
      operationId: getActionItems
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - in: query
          name: type
          schema:
            $ref: '#/components/schemas/ActionItemType'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/ActionStatus'
        - in: query
          name: severity
          schema:
            $ref: '#/components/schemas/Severity'
        - in: query
          name: vehicleNumber
          schema:
            type: string
        - in: query
          name: assignee
          schema:
            type: string
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionItemListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v2/action-items/{actionItemId}/status:
    parameters:
      - in: path
        name: actionItemId
        required: true
        schema:
          type: string
    patch:
      tags: [ActionItems]
      summary: 조치 항목 상태 변경
      operationId: patchActionItemStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionItemStatusUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionItemDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/action-items/{actionItemId}/memos:
    parameters:
      - in: path
        name: actionItemId
        required: true
        schema:
          type: string
    post:
      tags: [ActionItems]
      summary: 조치 항목 메모 추가
      operationId: postActionItemMemo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionItemMemoCreateRequest'
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionItemMemoResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/payments:
    get:
      tags: [Payments]
      summary: 결제 목록 조회
      operationId: getPayments
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - in: query
          name: type
          schema:
            $ref: '#/components/schemas/PaymentType'
        - in: query
          name: vehicleNumber
          schema:
            type: string
        - in: query
          name: customerName
          schema:
            type: string
        - in: query
          name: dueDateFrom
          schema:
            type: string
            format: date
        - in: query
          name: dueDateTo
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v2/payments/{paymentId}:
    parameters:
      - in: path
        name: paymentId
        required: true
        schema:
          type: string
    patch:
      tags: [Payments]
      summary: 결제 상태/정보 변경
      operationId: patchPaymentById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/payments/unpaid-summary:
    get:
      tags: [Payments]
      summary: 미납 요약 조회
      operationId: getPaymentsUnpaidSummary
      parameters:
        - in: query
          name: period
          required: true
          schema:
            $ref: '#/components/schemas/PeriodType'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnpaidSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v2/revenue/summary:
    get:
      tags: [Revenue]
      summary: 기간별 매출 요약
      operationId: getRevenueSummary
      parameters:
        - in: query
          name: period
          required: true
          schema:
            $ref: '#/components/schemas/PeriodType'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v2/revenue/charts:
    get:
      tags: [Revenue]
      summary: 매출 차트 데이터
      operationId: getRevenueCharts
      parameters:
        - in: query
          name: period
          required: true
          schema:
            $ref: '#/components/schemas/PeriodType'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueChartsResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v2/company:
    get:
      tags: [Settings]
      summary: 회사 정보 조회
      operationId: getCompany
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      tags: [Settings]
      summary: 회사 정보 수정
      operationId: patchCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/geofences:
    get:
      tags: [Settings]
      summary: 지오펜스 목록 조회
      operationId: getGeofences
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeofenceListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Settings]
      summary: 지오펜스 생성
      operationId: postGeofence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeofenceCreateRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeofenceDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/geofences/{geofenceId}:
    parameters:
      - in: path
        name: geofenceId
        required: true
        schema:
          type: string
    patch:
      tags: [Settings]
      summary: 지오펜스 수정
      operationId: patchGeofence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeofenceUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeofenceDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Settings]
      summary: 지오펜스 삭제
      operationId: deleteGeofence
      responses:
        '200':
          description: 삭제 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v2/users:
    get:
      tags: [Settings]
      summary: 계정 목록 조회
      operationId: getUsers
      parameters:
        - in: query
          name: role
          schema:
            $ref: '#/components/schemas/AccountRole'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/AccountStatus'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v2/users/{userId}:
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
    patch:
      tags: [Settings]
      summary: 계정 권한/상태 수정
      operationId: patchUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/import/assets:
    post:
      tags: [Settings]
      summary: 자산 CSV 대량 업로드
      operationId: postImportAssets
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '202':
          description: 업로드 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v2/import/reservations:
    post:
      tags: [Settings]
      summary: 예약 CSV 대량 업로드
      operationId: postImportReservations
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '202':
          description: 업로드 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequestError:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnauthorizedError:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ForbiddenError:
      description: 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFoundError:
      description: 리소스를 찾을 수 없음
      content:
